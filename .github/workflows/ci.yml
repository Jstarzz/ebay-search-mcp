name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 20.17.0
          - 22
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit and source safety tests
        run: npx tsx --test test/bestbuy.test.ts test/ebay.test.ts test/procurement.test.ts test/source-safety.test.ts

      - name: Stdio protocol test
        run: npx tsx --test test/stdio-protocol.test.ts
